<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق AI</title>
<link rel="manifest" href="manifest.webmanifest">
<script>window.__dip=null;addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__dip=e;window.__dipFn&&window.__dipFn()})</script>
<meta name="theme-color" content="#6d5efc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رفيق AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f6fb;--panel:#ffffff;--ink:#181a24;--mute:#6f7385;--bd:#e4e5ee;--soft:#eceefa;--acc:#6d5efc;--acc2:#9b6bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1016;--panel:#161923;--ink:#eceef6;--mute:#8f94a8;--bd:#262a38;--soft:#1e2230}}
:root[data-theme="dark"]{--bg:#0e1016;--panel:#161923;--ink:#eceef6;--mute:#8f94a8;--bd:#262a38;--soft:#1e2230}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;display:flex;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;transition:transform .12s,background .15s}
button:active{transform:scale(.94)}
aside{width:290px;background:var(--panel);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;flex:none;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
aside header{padding:14px;display:flex;gap:8px}
.new{flex:1;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:12px;padding:10px;font-weight:600}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);display:grid;place-items:center;flex:none}
#list{flex:1;overflow:auto;padding:0 10px 10px}
.ci{display:flex;align-items:center;border-radius:12px;padding:2px 4px 2px 10px;transition:background .15s}
.ci:hover,.ci.on{background:var(--soft)}
.ci span{flex:1;padding:9px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ci button{color:var(--mute);padding:6px 8px}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;position:relative}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--panel)}
#menu{display:none}
#ttl{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mode{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mute)}
#stat{font-size:13px;color:var(--mute);padding:6px 14px;background:var(--panel)}
#bar{height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .3s}
#stat{font-size:13px;color:var(--mute);padding:6px 14px;background:var(--panel)}
#bar{height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .3s}
#msgs{flex:1;overflow:auto;padding:18px 14px}
.row{max-width:780px;margin:0 auto 20px;animation:in .28s cubic-bezier(.2,.8,.2,1);border-radius:14px;position:relative}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.me{display:flex;flex-direction:column;align-items:flex-start}
.bub{white-space:pre-wrap;overflow-wrap:anywhere}
.me .bub{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:10px 15px;border-radius:18px 18px 18px 4px;max-width:88%}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;max-width:88%}
.atts img,.atts video{max-width:240px;max-height:220px;border-radius:14px;display:block}
.atts audio{max-width:240px}
.chip{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:6px 12px;font-size:14px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:4px;align-items:center;color:var(--mute);font-size:14px;margin-top:4px}
.tools button{color:var(--mute);padding:3px 9px;border-radius:9px}
.tools button:hover{background:var(--soft)}
.tools button:disabled{opacity:.3}
.sel{outline:2px solid var(--acc);outline-offset:6px;background:var(--soft)}
.selm .row{cursor:pointer}
@keyframes pulse{50%{transform:scale(1.1)}}
#mic.rec{background:#e5484d;color:#fff;border-color:#e5484d;animation:pulse 1s infinite}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.dots i{display:inline-block;width:9px;height:9px;margin:8px 3px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
pre{direction:ltr;text-align:left;background:var(--soft);border-radius:12px;padding:12px;overflow:auto;margin:8px 0;white-space:pre}
code{direction:ltr;unicode-bidi:isolate;background:var(--soft);padding:1px 6px;border-radius:6px}
pre code{background:none;padding:0}
.edit textarea{width:100%;min-height:80px;background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:10px;resize:vertical}
.edit div{display:flex;gap:8px;margin-top:6px}
.edit button{padding:6px 16px;border-radius:10px;border:1px solid var(--bd)}
.edit .ok{background:var(--acc);color:#fff;border-color:var(--acc)}
#empty{text-align:center;color:var(--mute);margin-top:16vh;animation:in .5s}
#empty b{display:block;font-size:26px;color:var(--ink);margin-bottom:6px}
#pending{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px;max-width:784px;margin:0 auto;width:100%}
#pending .chip{display:flex;gap:8px;align-items:center}
#pending .chip button{color:var(--mute)}
form{display:flex;gap:8px;align-items:flex-end;padding:10px 14px 12px;max-width:784px;width:100%;margin:0 auto}
#in{flex:1;background:var(--panel);border:1px solid var(--bd);border-radius:18px;padding:11px 16px;resize:none;max-height:160px;min-height:48px;transition:border-color .15s,box-shadow .15s}
#in:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
#go{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:21px;flex:none}
#pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:5px;box-shadow:0 10px 30px #0003;animation:in .15s;min-width:140px}
#pop button{display:block;width:100%;text-align:start;padding:9px 14px;border-radius:9px}
#pop button:hover{background:var(--soft)}
#pop .dg{color:#e5484d}
#selbar{position:absolute;inset-inline:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--bd);z-index:6;animation:in .2s}
#selbar button{padding:9px 18px;border-radius:12px;border:1px solid var(--bd)}
#selbar .dg{color:#e5484d}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:14px;z-index:30;animation:in .2s}
[hidden]{display:none!important}
#boot{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#5b4bf0,#9b6bff 70%,#22c1d6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px}
#boot img{width:104px;height:104px;border-radius:24px;box-shadow:0 14px 40px #0004}
#boot h2{margin:4px 0 0;font-size:28px}
#boot p{margin:0;max-width:330px;opacity:.93}
.pb{width:min(300px,80vw);height:10px;background:#ffffff40;border-radius:99px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .3s}
#bpct{font-size:14px;opacity:.9;min-height:22px}
#btime{font-size:13px;opacity:.85}
#blog{font-size:12.5px;text-align:start;width:min(340px,88vw);max-height:130px;overflow:auto;background:#0000002a;border-radius:12px;padding:8px 12px;line-height:1.7}
#blog:empty{display:none}
#blog .er{color:#ffd0d0}
#binst{background:#fff;color:#4b3ccf;font-weight:700;border-radius:14px;padding:12px 24px;box-shadow:0 8px 24px #0003}
#bbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#bbtns button{background:#fff;color:#4b3ccf;font-weight:600;border-radius:14px;padding:11px 20px}
#bbtns #bmini{background:#ffffff30;color:#fff}
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#5b4bf0,#9b6bff 70%,#22c1d6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px}
#gate img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 40px #0004;animation:in .5s}
#gate h1{margin:6px 0 0;font-size:30px}
#gate p{margin:0;max-width:340px;opacity:.92}
#gbtn{background:#fff;color:#4b3ccf;font-weight:700;border-radius:16px;padding:14px 34px;font-size:18px;box-shadow:0 8px 24px #0003}
#gsteps{background:#ffffff26;border-radius:14px;padding:12px 16px;max-width:340px;font-size:15px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--bd);border-radius:18px;width:min(420px,92vw);padding:20px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:12px 0 4px;color:var(--mute);font-size:14px}
dialog select,dialog input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px}
@media(max-width:760px){
aside{position:fixed;inset:0 auto 0 0;z-index:8;transform:translateX(-102%);box-shadow:0 0 40px #0006;padding-top:env(safe-area-inset-top,0px)}
[dir=rtl] aside{inset:0 0 0 auto;transform:translateX(102%)}
aside.open{transform:none}
#menu{display:grid}}
</style>
</head>

$("#bmini").onclick=()=>{dismissed=true;$("#boot").hidden=true;if(loadingModel)toast("ماشي، هرد بالمحرك الصغير والموديل بيكمل تحميل في الخلفية",4500)};
function showInst(){if(window.__dip)$("#binst").hidden=false}
window.__dipFn=showInst;showInst();
$("#binst").onclick=async()=>{const d=window.__dip;if(!d)return;d.prompt();try{await d.userChoice}catch(_){}window.__dip=null;$("#binst").hidden=true};
addEventListener("appinstalled",()=>toast("تم تثبيت التطبيق ✓",3000));
boot();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
try{navigator.storage?.persist?.()}catch(_){}
  const box=$("#msgs");box.innerHTML="";box.classList.toggle("selm",selMode);
  if(!c||!c.msgs.length){box.innerHTML="<div id='empty'><b>أهلًا 👋</b>اسألني أي حاجة أو أرفق ملف</div>";return}
  c.msgs.forEach((m,i)=>box.append(row(m,i)));box.scrollTop=box.scrollHeight}
function attEl(f){
  if(!f.url)return Object.assign(document.createElement("div"),{className:"chip",textContent:"📎 "+f.name+" (غير محفوظ)"});
  let e;if(f.type.startsWith("image/")){e=document.createElement("img");e.src=f.url}
  else if(f.type.startsWith("video/")){e=document.createElement("video");e.src=f.url;e.controls=true;e.playsInline=true}
  else if(f.type.startsWith("audio/")){e=document.createElement("audio");e.src=f.url;e.controls=true}
  else{e=document.createElement("div");e.className="chip";e.textContent="📎 "+f.name}
  return e}
function row(m,i){
  const r=document.createElement("div");r.className="row"+(sel.has(i)?" sel":"");
  r.onclick=e=>{if(!selMode)return;e.preventDefault();sel.has(i)?sel.delete(i):sel.add(i);r.classList.toggle("sel");$("#selbar").hidden=!sel.size&&false}
  const tools=document.createElement("div");tools.className="tools";
  const more=btn("⋯",e=>{e.stopPropagation();menu(e.currentTarget,i)},"mb");more.style.fontSize="20px";
  if(m.r==="user"){
    r.classList.add("me");const v=m.v[m.c];
    if(v.f?.length){const a=document.createElement("div");a.className="atts";v.f.forEach(f=>a.append(attEl(f)));r.append(a)}
    if(v.t){const b=document.createElement("div");b.className="bub";b.dir="auto";b.textContent=v.t;r.append(b)}
    if(m.v.length>1){
      const a=btn("›",()=>sw(i,-1));a.disabled=m.c===0;const b=btn("‹",()=>sw(i,1));b.disabled=m.c===m.v.length-1;
      const n=document.createElement("span");n.textContent=(m.c+1)+" / "+m.v.length;tools.append(a,n,b)}
    tools.append(more)
  }else{
    const b=document.createElement("div");b.className="bub";b.dir="auto";b.innerHTML=m.t?fmt(m.t):DOTS;r.append(b);
    if(m.t){tools.append(btn("نسخ",()=>copyText(m.t)),btn(speakIdx===i?"⏹ إيقاف":"🔊 اسمع",e=>speak(m.t,i,e.currentTarget),"spk"),more)}
  }
  r.append(tools);return r}

function menu(el,i){
  const c=chat(),m=c.msgs[i],p=$("#pop");p.innerHTML="";
  const txt=m.r==="user"?m.v[m.c].t:m.t;
  const items=[["نسخ",()=>copyText(txt||"")],["تحديد",()=>{selMode=true;sel=new Set([i]);$("#selbar").hidden=false;draw()}]];
  if(m.r==="user")items.splice(1,0,["تعديل",()=>edit(i)]);
  else if(i===c.msgs.length-1&&!busy)items.push(["إعادة الرد",()=>{c.msgs.pop();save();gen()}]);
  items.push(["حذف",()=>del(i),1]);
  items.forEach(([l,f,d])=>{const b=btn(l,()=>{p.hidden=true;f()},d?"dg":"");p.append(b)});
  p.hidden=false;const r=el.getBoundingClientRect();
  p.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-p.offsetHeight-8))+"px";
  p.style.left=Math.max(8,Math.min(r.left,innerWidth-p.offsetWidth-8))+"px"}
document.addEventListener("click",e=>{if(!e.target.closest("#pop,.mb"))$("#pop").hidden=true});

function del(i){if(busy)return;const ms=chat().msgs;const n=ms[i].r==="user"&&ms[i+1]?.r==="assistant"?2:1;ms.splice(i,n);save();draw()}
function exitSel(){selMode=false;sel=new Set();$("#selbar").hidden=true}
$("#sCancel").onclick=()=>{exitSel();draw()};
$("#sCopy").onclick=()=>{const ms=chat().msgs;copyText([...sel].sort((a,b)=>a-b).map(i=>ms[i].r==="user"?ms[i].v[ms[i].c].t:ms[i].t).join("\n\n"));exitSel();draw()};
$("#sDel").onclick=()=>{if(!sel.size||!confirm("حذف الرسائل المحددة؟"))return;const ms=chat().msgs;chat().msgs=ms.filter((_,i)=>!sel.has(i));exitSel();save();draw()};

function sw(i,d){if(busy)return;const ms=chat().msgs,m=ms[i];
  m.v[m.c].a=ms.splice(i+1);m.c+=d;ms.push(...m.v[m.c].a);m.v[m.c].a=[];save();draw()}
function edit(i){if(busy)return;const m=chat().msgs[i],r=$("#msgs").children[i];
  r.innerHTML="<div class='edit' style='width:100%'><textarea dir='auto'></textarea><div></div></div>";
  const ta=r.querySelector("textarea");ta.value=m.v[m.c].t;const bx=r.querySelector("div div");
  bx.append(btn("إرسال",()=>{const t=ta.value.trim();if(!t&&!m.v[m.c].f?.length)return;
    const ms=chat().msgs;m.v[m.c].a=ms.splice(i+1);m.v.push({t,a:[],f:m.v[m.c].f});m.c=m.v.length-1;save();draw();gen()},"ok"),btn("إلغاء",draw));ta.focus()}

/* ---------- attachments ---------- */
const TXT=/\.(txt|md|csv|json|js|py|html|css|xml|log)$/i;
function drawPend(){const b=$("#pending");b.innerHTML="";
  pend.forEach((f,k)=>{const c=document.createElement("div");c.className="chip";const s=document.createElement("span");s.textContent=(f.type.startsWith("image/")?"🖼 ":"📎 ")+f.name;c.append(s,btn("✕",()=>{pend.splice(k,1);drawPend()}));b.append(c)})}
$("#clip").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  for(const file of [...e.target.files].slice(0,8)){
    if(file.size>15*1024*1024){toast("الملف "+file.name+" كبير (الحد 15MB)");continue}
    const f={name:file.name,type:file.type||"application/octet-stream",size:file.size,blob:file,url:URL.createObjectURL(file)};
    if(f.type.startsWith("text/")||TXT.test(file.name)){try{f.text=(await file.text()).slice(0,20000)}catch(_){}}
    pend.push(f)}
  e.target.value="";drawPend()};

/* ---------- generation ---------- */
function apiMessages(){
  const out=[{role:"system",content:SYS2+(S.name?" اسم المستخدم: "+S.name+".":"")}];
  chat().msgs.slice(0,-1).slice(-20).forEach(m=>{
    if(m.r==="user"){const v=m.v[m.c];let t=v.t||"";(v.f||[]).forEach(f=>{t+=f.text?"\n\n[ملف: "+f.name+"]\n"+f.text:"\n\n[مرفق: "+f.name+" — لا يمكن تحليل محتواه]"});
      const l=out[out.length-1];if(l.role==="user")l.content+="\n\n"+t;else out.push({role:"user",content:t})}
    else if(m.t&&!m.t.startsWith("⚠"))out.push({role:"assistant",content:m.t})});
  return out}
function blog(t,cls){const d=document.createElement("div");d.textContent=t;if(cls)d.className=cls;const b=$("#blog");b.append(d);b.scrollTop=b.scrollHeight}
async function getEngine(){
  if(engine&&engModel===S.cfg.mdl)return engine;
  $("#blog").innerHTML="";blog("• بدأت التجهيز");
  if(!navigator.gpu)throw new Error("المتصفح مش بيدعم WebGPU (محتاج Chrome حديث)");
  blog("• بفحص كرت الشاشة (WebGPU)…");
  let ad=null;try{ad=await navigator.gpu.requestAdapter()}catch(_){}
  if(!ad)throw new Error("جهازك مش بيدعم WebGPU");
  const f16=ad.features.has("shader-f16");blog(f16?"✓ كرت الشاشة مدعوم":"✓ كرت الشاشة مدعوم (وضع التوافق)");
  let mdl=S.cfg.mdl;if(!f16)mdl=mdl.replace("q4f16_1","q4f32_1");
  if(!HTTP)blog("⚠ الصفحة مفتوحة من ملف على الموبايل (content://) فالتحميل غالبًا هيعلّق. افتحها من رابط https.","er");
  blog("• بختبر الاتصال بسيرفر الموديل…");
  const probe=async(u,o)=>{const t=Date.now(),ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);try{const r=await fetch(u,{...(o||{}),signal:ac.signal});clearTimeout(to);return r.ok||r.status===206?"✓ ("+(Date.now()-t)+"ms)":"✗ كود "+r.status}catch(e){clearTimeout(to);return "✗ "+(e.name==="AbortError"?"انتهت المهلة 15 ث":"فشل الاتصال")}};
  const base="https://huggingface.co/mlc-ai/"+mdl+"/resolve/main/";
  const r1=await probe(base+"mlc-chat-config.json");blog("  ملف الإعدادات: "+r1,r1[0]==="✗"?"er":"");
  const r2=await probe(base+"params_shard_0.bin",{headers:{Range:"bytes=0-1023"}});blog("  ملف الموديل: "+r2,r2[0]==="✗"?"er":"");
  if(r1[0]==="✗")throw new Error("مش قادر أوصل لسيرفر الموديل (huggingface.co) من النت بتاعك");
  blog("• بحمّل مكتبة التشغيل…");
  webllm=webllm||await import(WEBLLM);blog("✓ المكتبة اتحملت");
  blog("• الموديل: "+mdl.replace("-MLC","").replace("-Instruct",""));
  for(let k=1;;k++){
    try{engine=await webllm.CreateMLCEngine(mdl,{appConfig:{...webllm.prebuiltAppConfig,useIndexedDBCache:true},initProgressCallback:p=>stat(Math.round(p.progress*100)+"% — "+p.text.slice(0,60),p.progress)});break}
    catch(e){blog("✗ "+String((e&&e.message)||e).slice(0,100),"er");if(k>=4){stat("");throw e}blog("• بحاول تاني ("+k+"/4)…");stat("",0);await sleep(2000)}}
  engModel=S.cfg.mdl;blog("✓ الموديل جاهز");return engine}
async function gen(){
  const c=chat();busy=true;$("#go").textContent="■";
  const m={r:"assistant",t:""};c.msgs.push(m);draw();
  const put=()=>{const e=$("#msgs").lastChild.querySelector(".bub");e.innerHTML=m.t?fmt(m.t):DOTS;const b=$("#msgs");b.scrollTop=b.scrollHeight};
  try{
    if(useReal()){
      const e=await getEngine();stat("بفكر وبحلل سؤالك…",.15);let first=true;
      const it=await e.chat.completions.create({messages:apiMessages(),stream:true,temperature:.6,top_p:.9,max_tokens:1024});
      for await(const ch of it){if(first){stat("");first=false}m.t+=ch.choices[0]?.delta?.content||"";put()}
    }else{
      await sleep(80);liteStop=false;const lm=c.msgs[c.msgs.length-2];
      for(const ch of brain(lm.v[lm.c])){if(liteStop)break;m.t+=ch;put();await sleep(6)}
    }
  }catch(err){
    const code=err&&err.code;
    if(err&&(err.name==="AbortError"||code==="aborted")){}
    else{m.t=m.t||"";m.t+=(m.t?"\n\n":"")+"⚠ "+(code==="not_granted"?"لازم توافق على السماح باستخدام Claude عشان أرد.":code==="rate_limited"?"الطلبات كتير، استنى شوية وجرّب تاني.":(err&&err.message)||"حصل خطأ")}}
  busy=false;ctrl=null;if(!loadingModel)stat("");stat("");$("#go").textContent="↑";
  if(!m.t)c.msgs.pop();
  save();draw();
  if(voiceTurn){voiceTurn=false;if(m.t&&!m.t.startsWith("⚠")){speak(m.t,c.msgs.length-1);draw()}}}

function send(){
  if(busy){liteStop=true;try{engine?.interruptGenerate()}catch(_){}return}
  const t=$("#in").value.trim();if(!t&&!pend.length)return;
  if(!chat())newChat();const cc=chat();exitSel();
  cc.msgs.push({r:"user",v:[{t,a:[],f:pend}],c:0});
  if(cc.title==="محادثة جديدة"){const s=(t||pend[0].name).replace(/\s+/g," ");cc.title=s.slice(0,36)+(s.length>36?"…":"")}
  pend=[];drawPend();$("#in").value="";$("#in").style.height="";save();draw();gen()}
$("#f").onsubmit=e=>{e.preventDefault();stopSpeak();send()};
$("#in").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,160)+"px"};
$("#in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(min-width:761px)").matches){e.preventDefault();$("#f").requestSubmit()}};
/* ---------- talk to him (microphone) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false;
function startRec(local){
  let finalText="",heard=false,retry=false;
  rec=new SR();rec.lang="ar-EG";rec.interimResults=true;rec.continuous=false;
  if(local){try{rec.processLocally=true}catch(_){}}
  rec.onstart=()=>{listening=true;$("#mic").classList.add("rec")};
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;heard=true;finalText=t;$("#in").value=t};
  rec.onerror=e=>{
    if(e.error==="language-not-supported"&&local){retry=true;return}
    toast(({"not-allowed":"اسمح للميكروفون من إعدادات الموقع","service-not-allowed":"اسمح للميكروفون من إعدادات الموقع","network":"التعرف على الصوت محتاج إنترنت على جهازك (أو حزمة صوت عربي أوفلاين)","no-speech":"ما سمعتش حاجة، جرّب تاني","audio-capture":"مفيش ميكروفون شغال"})[e.error]||"تعذّر التعرف على الصوت")};
  rec.onend=()=>{listening=false;$("#mic").classList.remove("rec");
    if(retry){startRec(false);return}
    if(heard&&finalText.trim()&&!busy){voiceTurn=true;$("#f").requestSubmit()}};
  try{rec.start()}catch(_){}}
$("#mic").onclick=()=>{
  if(!SR){toast("المتصفح ده مش بيدعم الكلام. استخدم Chrome");return}
  if(listening){rec.stop();return}
  stopSpeak();startRec(true)};
$("#nw").onclick=()=>{if(!busy){exitSel();newChat();$("#side").classList.remove("open")}};
$("#menu").onclick=()=>$("#side").classList.toggle("open");

$("#cfg").onclick=()=>{const c=S.cfg;$("#eng").value=c.eng;$("#mdl").value=c.mdl;$("#acc").value=c.acc;$("#thm").value=c.thm;$("#dlg").showModal()};
$("#tryReal").onclick=()=>{S.cfg.eng="web";S.cfg.mdl=$("#mdl").value;save();$("#dlg").close();boot(true)};
$("#cl").onclick=()=>$("#dlg").close();
$("#sv").onclick=()=>{S.cfg={v:3,eng:$("#eng").value,mdl:$("#mdl").value,acc:$("#acc").value,thm:$("#thm").value};save();applyTheme();modeTxt();$("#dlg").close();boot()};
$("#wipe").onclick=()=>{if(confirm("مسح كل المحادثات نهائيًا؟")){S.chats=[];S.cur=null;save();$("#dlg").close();newChat()}};

applyTheme();
if(!S.chats.length)newChat();else{if(!chat())S.cur=S.chats[0].id;draw()}
modeTxt();
</script>
